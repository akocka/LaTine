<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LaTine — Langoși, Pizza & Plăcinte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800;900&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#B3261E; --wine:#3A0D12; --gold:#F2C230;
  --text:#3A0D12; --muted:#7A4A4E; --line:#EBCFCB; --bg:#FFFFFF; --card:#FFFFFF; --soft:#FBEDEB; --bar:#3A0D12; --accent:#B3261E;
  --display:"Rubik", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --text:#F8E9E7; --muted:#C9A3A0; --line:#4A2226; --bg:#1E0B0D; --card:#2A1215; --soft:#2A1215; --bar:#7E1812; --accent:#F26B5E;
  }
}
:root[data-theme="dark"]{
  --text:#F8E9E7; --muted:#C9A3A0; --line:#4A2226; --bg:#1E0B0D; --card:#2A1215; --soft:#2A1215; --bar:#7E1812; --accent:#F26B5E;
}
[hidden]{display:none !important}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:1.0625rem;line-height:1.55;overflow-x:hidden}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.hero :focus-visible{outline-color:var(--gold)}
.wrap{max-width:62rem;margin:0 auto;padding:0 1.25rem}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:.6rem}
.brand{font-family:var(--display);font-weight:900;font-size:1.5rem;letter-spacing:-.02em;text-decoration:none;color:var(--accent);flex:1;min-width:0}
.tools{display:flex;gap:.45rem;flex:0 0 auto}
.pill{display:inline-flex;align-items:center;gap:.35rem;padding:.45rem .85rem;border-radius:999px;border:2px solid var(--text);background:transparent;color:var(--text);text-decoration:none;font-weight:600;font-size:.9rem;white-space:nowrap}
.lang{border-color:var(--line);background:var(--soft)}

/* Hero */
.hero{background:var(--red);color:#fff;overflow:hidden}
.hero .wrap{padding-top:2.5rem;padding-bottom:2.5rem;display:grid;gap:2rem;grid-template-columns:1fr;align-items:center}
@media (min-width:820px){.hero .wrap{grid-template-columns:1.1fr .9fr;padding-top:3.5rem;padding-bottom:3.5rem}}
.wordmark{font-family:var(--display);font-weight:900;font-size:clamp(4rem,17vw,8.5rem);line-height:.85;letter-spacing:-.045em;margin:0}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(1.5rem,5vw,2.3rem);line-height:1.12;margin:.9rem 0 0;max-width:20ch}
.hero .sub{max-width:32rem;margin:1rem 0 1.5rem;font-size:1.08rem;opacity:.95}
.ctas{display:flex;flex-wrap:wrap;gap:.75rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.85rem 1.4rem;border-radius:999px;border:0;font-weight:700;text-decoration:none;font-size:1rem}
.btn-gold{background:var(--gold);color:#3A0D12}
.btn-line{background:transparent;color:#fff;box-shadow:inset 0 0 0 2px #fff}

.best{background:#fff;color:#3A0D12;border-radius:28px;padding:1.25rem 1.25rem 1.4rem;position:relative}
.best .tag{display:inline-block;background:var(--gold);color:#3A0D12;font-weight:700;font-size:.85rem;padding:.25rem .7rem;border-radius:999px}
.best svg{display:block;width:100%;max-width:300px;height:auto;margin:.5rem auto .25rem}
.best h2{font-family:var(--display);font-weight:800;font-size:1.55rem;line-height:1.1;margin:.25rem 0 .35rem}
.best p{margin:0 0 1rem;color:#7A4A4E}
.best .row{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.best .bprice{font-family:var(--display);font-weight:800;font-size:1.6rem}
.best .add{border-color:#3A0D12;color:#3A0D12;background:var(--gold);border-color:var(--gold);padding:.6rem 1.1rem;font-size:1rem}

.perks{border-bottom:1px solid var(--line)}
.perks ul{list-style:none;margin:0;padding:1rem 0;display:flex;flex-wrap:wrap;gap:.5rem 1.75rem;justify-content:space-between}
.perks li{display:flex;align-items:center;gap:.5rem;font-weight:600;font-size:.98rem}
.perks li::before{content:"";width:.6rem;height:.6rem;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 35%,transparent)}

section{padding:3rem 0}
h2.sec{font-family:var(--display);font-weight:800;font-size:clamp(2rem,6vw,2.7rem);letter-spacing:-.02em;margin:0 0 .5rem;line-height:1.05}
.lead{color:var(--muted);margin:0 0 1.25rem;max-width:40rem}
.cats{position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px);z-index:10;background:var(--bg);display:flex;gap:.5rem;overflow-x:auto;padding:.75rem 0;margin-bottom:.5rem;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats a{flex:0 0 auto;padding:.45rem 1rem;border-radius:999px;background:var(--soft);text-decoration:none;font-weight:600;font-size:.95rem}
.cat{margin-top:1.75rem}
.cat h3{font-family:var(--display);font-weight:800;font-size:1.55rem;margin:0 0 .5rem;display:flex;align-items:baseline;flex-wrap:wrap;gap:.2rem .6rem;color:var(--accent)}
.cat h3 small{font-family:var(--body);font-size:.95rem;color:var(--muted);font-weight:500}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:0 2rem}
.item{display:grid;grid-template-columns:1fr auto;gap:.25rem 1rem;padding:1rem 0;border-bottom:1px dashed var(--line)}
.item h4{margin:0;font-size:1.08rem;font-weight:700}
.item .badge{display:inline-block;margin-left:.4rem;background:var(--gold);color:#3A0D12;font-size:.75rem;font-weight:700;padding:.1rem .5rem;border-radius:999px;vertical-align:.12em}
.item p{margin:0;color:var(--muted);font-size:.95rem;grid-column:1/2}
.price{font-weight:700;white-space:nowrap}
.qty{grid-column:2/3;grid-row:2/3;align-self:end;justify-self:end}
.add{padding:.4rem .95rem;border-radius:999px;border:2px solid var(--text);background:transparent;color:var(--text);font-weight:700;font-size:.9rem}
.stepper{display:inline-flex;align-items:center;border-radius:999px;background:var(--red);color:#fff}
.stepper button{width:2.3rem;height:2.3rem;border:0;background:transparent;color:#fff;font-size:1.2rem;font-weight:700}
.stepper span{min-width:1.4rem;text-align:center;font-weight:700}

.about{background:var(--soft)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:2rem}
.locs{display:grid;gap:1.25rem}
.loc h3{font-family:var(--display);font-weight:800;font-size:1.35rem;margin:0 0 .2rem;color:var(--accent)}
.loc p{margin:0;color:var(--muted)}
.loc a{font-weight:600;color:var(--text)}
footer{padding:2rem 0 7rem;color:var(--muted);font-size:.9rem}

.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:.75rem 1rem calc(.75rem + env(safe-area-inset-bottom,0px));background:var(--bar);display:flex;justify-content:center;transform:translateY(110%);transition:transform .25s ease}
.cartbar.show{transform:none}
@media (prefers-reduced-motion: reduce){.cartbar{transition:none}}
.cartbar button{width:100%;max-width:36rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;background:var(--gold);color:#3A0D12;border:0;border-radius:999px;padding:.9rem 1.3rem;font-weight:700;font-size:1.02rem}

.scrim{position:fixed;inset:0;background:rgba(30,6,8,.55);z-index:40;display:none}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:88%;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:1.25rem 1.25rem calc(1.5rem + env(safe-area-inset-bottom,0px));display:none;max-width:40rem;margin:0 auto}
.sheet.open{display:block}
.sheet header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem}
.sheet h2{font-family:var(--display);font-weight:800;font-size:1.8rem;margin:0}
.x{border:0;background:var(--soft);color:var(--text);width:2.4rem;height:2.4rem;border-radius:50%;font-size:1.2rem}
.lines{list-style:none;margin:0;padding:0}
.lines li{display:flex;justify-content:space-between;gap:1rem;padding:.55rem 0;border-bottom:1px dashed var(--line)}
.total{display:flex;justify-content:space-between;font-weight:700;font-size:1.15rem;padding:.9rem 0 .4rem}
.upsell{background:var(--soft);border-radius:14px;padding:.8rem .9rem;margin:.5rem 0 .25rem}
.upsell b{display:block;margin-bottom:.5rem}
.upsell .chips{display:flex;flex-wrap:wrap;gap:.5rem}
.upsell button{border:1.5px solid var(--line);background:var(--bg);color:var(--text);border-radius:999px;padding:.4rem .85rem;font-weight:600;font-size:.92rem}
label{display:block;font-weight:600;margin:.9rem 0 .3rem;font-size:.95rem}
input[type=text],textarea{width:100%;padding:.75rem .85rem;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:1rem}
textarea{min-height:4.5rem;resize:vertical}
.seg{display:flex;gap:.5rem}
.seg label{flex:1;margin:0;display:flex;align-items:center;justify-content:center;gap:.4rem;padding:.7rem;border-radius:12px;border:1.5px solid var(--line);cursor:pointer;font-weight:600}
.seg input,.pick input{accent-color:var(--red)}
.seg label:has(input:checked),.pick label:has(input:checked){border-color:var(--accent);background:color-mix(in srgb, var(--red) 12%, transparent)}
.pick{display:grid;gap:.5rem}
.pick label{margin:0;display:flex;gap:.7rem;align-items:flex-start;padding:.8rem .9rem;border-radius:12px;border:1.5px solid var(--line);cursor:pointer;font-weight:400}
.pick input{margin-top:.3rem}
.pick b{display:block}
.pick span{color:var(--muted);font-size:.92rem}
.actions{display:grid;gap:.6rem;margin-top:1.25rem}
.actions .btn{width:100%}
.btn-red{background:var(--red);color:#fff;font-size:1.08rem;padding:1rem 1.4rem}
.btn-soft{background:var(--soft);color:var(--text)}
.btn[disabled]{opacity:.6;cursor:wait}
.doneid{font-family:var(--display);font-weight:800;font-size:2rem;color:var(--accent);margin:.5rem 0 0}
.note{font-size:.88rem;color:var(--muted);margin:.75rem 0 0}
.err{color:var(--accent);font-weight:600;font-size:.92rem;min-height:1.2em;margin:.5rem 0 0}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#top">LaTine</a>
    <div class="tools">
      <button class="pill lang" id="langBtn" type="button"></button>
      <a class="pill" href="#visit">📞 <span data-t="call"></span></a>
    </div>
  </div>
</header>

<main id="top">
  <div class="hero">
    <div class="wrap">
      <div>
        <p class="wordmark">LaTine</p>
        <h1 data-t="h1"></h1>
        <p class="sub" data-t="sub"></p>
        <div class="ctas">
          <a class="btn btn-gold" href="#menu" data-t="seeMenu"></a>
          <a class="btn btn-line" href="#visit" data-t="callOrder"></a>
        </div>
      </div>

      <div class="best">
        <span class="tag" data-t="bestTag"></span>
        <svg viewBox="0 0 300 190" role="img" aria-labelledby="langosTitle">
          <title id="langosTitle">Langoș</title>
          <ellipse cx="150" cy="170" rx="118" ry="12" fill="#3A0D12" opacity=".12"/>
          <path d="M40 98c-6-34 26-66 70-72 22-3 38 4 58 2 34-4 72 10 88 40 14 28 4 62-26 78-24 13-48 10-72 14-26 4-48 16-76 6-26-9-38-40-42-68z" fill="#E9A93A"/>
          <path d="M58 98c-4-26 22-50 56-55 18-3 32 3 48 1 28-3 58 8 70 31 11 22 3 48-21 60-19 10-38 8-57 11-21 3-38 12-60 4-20-7-33-30-36-52z" fill="#F6C766"/>
          <path d="M92 86c12-16 38-22 60-18 20 3 44 0 58 14 12 12 6 30-10 38-18 9-38 6-56 10-20 4-40 2-50-12-8-10-8-22-2-32z" fill="#FFF7EA"/>
          <g fill="#F2C230" stroke="#E0A81C" stroke-width="1">
            <rect x="100" y="84" width="22" height="5" rx="2.5" transform="rotate(-18 111 86)"/>
            <rect x="140" y="76" width="24" height="5" rx="2.5" transform="rotate(12 152 78)"/>
            <rect x="176" y="92" width="22" height="5" rx="2.5" transform="rotate(-8 187 94)"/>
            <rect x="120" y="108" width="24" height="5" rx="2.5" transform="rotate(20 132 110)"/>
            <rect x="162" y="112" width="20" height="5" rx="2.5" transform="rotate(-24 172 114)"/>
            <rect x="96" y="104" width="16" height="5" rx="2.5" transform="rotate(6 104 106)"/>
            <rect x="150" y="96" width="18" height="5" rx="2.5" transform="rotate(-40 159 98)"/>
          </g>
          <g fill="#FFFFFF" stroke="#E8DCC6" stroke-width="1">
            <circle cx="132" cy="94" r="3"/><circle cx="170" cy="84" r="2.5"/><circle cx="190" cy="108" r="3"/><circle cx="114" cy="118" r="2.5"/>
          </g>
        </svg>
        <h2 data-t="bestName"></h2>
        <p data-t="bestDesc"></p>
        <div class="row">
          <span class="bprice" id="bestPrice"></span>
          <div class="qty" data-id="l2" data-big="1"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="perks">
    <div class="wrap">
      <ul>
        <li data-t="perk1"></li>
        <li data-t="perk2"></li>
        <li data-t="perk3"></li>
      </ul>
    </div>
  </div>

  <section id="menu">
    <div class="wrap">
      <h2 class="sec" data-t="menu"></h2>
      <p class="lead" data-t="lead"></p>
      <nav class="cats" id="cats"></nav>
      <div id="menuList"></div>
    </div>
  </section>

  <section class="about" id="visit">
    <div class="wrap two">
      <div>
        <h2 class="sec" data-t="about"></h2>
        <p data-t="about1"></p>
        <p data-t="about2"></p>
      </div>
      <div>
        <h2 class="sec" data-t="visit"></h2>
        <div class="locs" id="locs"></div>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">© <span id="yr"></span> LaTine. <span data-t="footer"></span></div>
</footer>

<div class="cartbar" id="cartbar">
  <button id="openCart" type="button"><span id="cartCount"></span><span><span data-t="viewOrder"></span> · <span id="cartTotal"></span></span></button>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <header>
    <h2 id="sheetTitle"></h2>
    <button class="x" id="closeCart" type="button" aria-label="✕">✕</button>
  </header>
  <div id="orderForm">
    <ul class="lines" id="lines"></ul>
    <div class="upsell" id="upsell" hidden>
      <b data-t="upsell"></b>
      <div class="chips" id="upsellChips"></div>
    </div>
    <div class="total"><span data-t="total"></span><span id="sheetTotal"></span></div>

    <label data-t="whichLoc"></label>
    <div class="pick" id="pick"></div>

    <label for="cname" data-t="yourName"></label>
    <input type="text" id="cname" autocomplete="name">

    <label for="cphone" data-t="yourPhone"></label>
    <input type="text" id="cphone" inputmode="tel" autocomplete="tel">

    <label data-t="mode"></label>
    <div class="seg">
      <label><input type="radio" name="mode" value="pickup" checked> <span data-t="pickup"></span></label>
      <label><input type="radio" name="mode" value="delivery"> <span data-t="delivery"></span></label>
    </div>

    <div id="addrWrap" hidden>
      <label for="caddr" data-t="delAddr"></label>
      <input type="text" id="caddr" autocomplete="street-address">
    </div>

    <label for="cnotes" data-t="notes"></label>
    <textarea id="cnotes"></textarea>

    <p class="err" id="err" role="alert"></p>
    <div class="actions">
      <button class="btn btn-red" id="sendOrder" type="button"></button>
      <a class="btn btn-soft" id="sheetCall" href="#visit" data-t="callOrder"></a>
    </div>
    <p class="note" data-t="confirmNote"></p>
  </div>
  <div id="done" hidden>
    <p class="doneid" id="doneId"></p>
    <p data-t="doneText"></p>
    <div class="actions"><button class="btn btn-red" id="newOrder" type="button" data-t="newOrder"></button></div>
  </div>
</div>

/* ============================================== */

const $ = s => document.querySelector(s);
const ITEMS = Object.fromEntries(MENU.flatMap(c => c.items).map(i => [i.id, i]));
const LOC = id => CONFIG.locations.find(l => l.id === id);
let lang = "ro", cart = {}, locId = "", orderId = "";
try { lang = localStorage.getItem("lang") === "hu" ? "hu" : "ro"; } catch(e) {}
try { cart = JSON.parse(localStorage.getItem("cart") || "{}") || {}; } catch(e) { cart = {}; }
try { locId = localStorage.getItem("loc") || ""; } catch(e) {}
for (const k in cart) if (!ITEMS[k]) delete cart[k];
if (!LOC(locId)) locId = "";

const t = k => T[lang][k];
const money = n => (Number.isInteger(n) ? n : n.toFixed(2)) + " " + CONFIG.currency;
const store = (k,v) => { try { localStorage.setItem(k, v); } catch(e) {} };
const nameOf = id => ITEMS[id][lang][0];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function applyLang(){
  document.documentElement.lang = lang;
  document.title = "LaTine — " + t("title");
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  $("#langBtn").textContent = t("switchTo");
  $("#langBtn").setAttribute("lang", lang === "ro" ? "hu" : "ro");
  $("#cnotes").placeholder = t("notesPh");
  $("#sendOrder").textContent = t("send");
  $("#sheetTitle").textContent = $("#done").hidden ? t("yourOrder") : t("doneTitle");
  $("#bestPrice").textContent = money(ITEMS.l2.price);
  $("#err").textContent = "";
  renderLocations();
  renderMenu();
}

function renderLocations(){
  $("#locs").innerHTML = CONFIG.locations.map(l => `
    <div class="loc">
      <h3>${esc(l.name)}</h3>
      <p>${esc(l.address[lang])}</p>
      <p>${esc(l.hours[lang])}</p>
      <p>${t("phone")}: <a href="tel:${esc(l.phone)}">${esc(l.phoneDisplay)}</a></p>
    </div>`).join("");
  $("#pick").innerHTML = CONFIG.locations.map(l => `
    <label><input type="radio" name="loc" value="${l.id}" ${l.id===locId?"checked":""}>
      <div><b>${esc(l.name)}</b><span>${esc(l.address[lang])}</span></div></label>`).join("");
  document.querySelectorAll('input[name=loc]').forEach(r => r.onchange = () => { locId = r.value; store("loc", locId); updateCall(); });
  updateCall();
}
function updateCall(){ const l = LOC(locId); $("#sheetCall").href = l ? "tel:" + l.phone : "#visit"; }

function renderMenu(){
  $("#cats").innerHTML = MENU.map((c,i) => `<a href="#cat-${i}">${c.cat[lang]}</a>`).join("");
  $("#menuList").innerHTML = MENU.map((c,i) => `
    <div class="cat" id="cat-${i}">
      <h3>${c.cat[lang]}${c.note[lang] ? ` <small>${c.note[lang]}</small>` : ""}</h3>
      <div class="items">${c.items.map(it => `
        <div class="item">
          <h4>${it[lang][0]}${it.best ? `<span class="badge">${t("best")}</span>` : ""}</h4><span class="price">${money(it.price)}</span>
          <p>${it[lang][1]}</p>
          <div class="qty" data-id="${it.id}"></div>
        </div>`).join("")}
      </div>
    </div>`).join("");
  renderCart();
}

function renderCart(){
  document.querySelectorAll(".qty").forEach(el => {
    const id = el.dataset.id, q = cart[id] || 0, n = nameOf(id);
    el.innerHTML = q
      ? `<span class="stepper"><button type="button" data-d="-1" aria-label="− ${esc(n)}">−</button><span aria-live="polite">${q}</span><button type="button" data-d="1" aria-label="+ ${esc(n)}">+</button></span>`
      : `<button class="add" type="button" data-d="1" aria-label="${t("add")}: ${esc(n)}">${el.dataset.big ? t("addBig") : t("add")}</button>`;
  });
  const count = Object.values(cart).reduce((a,b)=>a+b,0);
  const total = Object.entries(cart).reduce((s,[id,q]) => s + ITEMS[id].price*q, 0);
  $("#cartCount").textContent = t("count")(count);
  $("#cartTotal").textContent = money(total);
  $("#sheetTotal").textContent = money(total);
  $("#cartbar").classList.toggle("show", count > 0);
  $("#lines").innerHTML = Object.entries(cart).map(([id,q]) =>
    `<li><span>${q} × ${esc(nameOf(id))}</span><span>${money(ITEMS[id].price*q)}</span></li>`).join("");
  const hasDrink = Object.keys(cart).some(id => ITEMS[id].drink);
  $("#upsell").hidden = hasDrink || !count;
  $("#upsellChips").innerHTML = MENU.flatMap(c => c.items).filter(i => i.drink)
    .map(i => `<button type="button" data-up="${i.id}">+ ${esc(i[lang][0])} · ${money(i.price)}</button>`).join("");
  if (!count && $("#done").hidden) closeSheet();
}

document.addEventListener("click", e => {
  const up = e.target.closest("[data-up]");
  if (up) { cart[up.dataset.up] = (cart[up.dataset.up]||0) + 1; store("cart", JSON.stringify(cart)); renderCart(); return; }
  const b = e.target.closest("[data-d]");
  if (!b) return;
  const id = b.closest(".qty").dataset.id;
  cart[id] = Math.max(0, (cart[id]||0) + +b.dataset.d);
  if (!cart[id]) delete cart[id];
  store("cart", JSON.stringify(cart));
  renderCart();
});

$("#langBtn").onclick = () => { lang = lang === "ro" ? "hu" : "ro"; store("lang", lang); applyLang(); };

function openSheet(){ $("#sheet").classList.add("open"); $("#scrim").classList.add("open"); $("#closeCart").focus(); }
function closeSheet(){ $("#sheet").classList.remove("open"); $("#scrim").classList.remove("open"); }
$("#openCart").onclick = openSheet;
$("#closeCart").onclick = closeSheet;
$("#scrim").onclick = closeSheet;
$("#sheetCall").addEventListener("click", () => { if (!LOC(locId)) closeSheet(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

document.querySelectorAll('input[name=mode]').forEach(r => r.onchange = () => {
  $("#addrWrap").hidden = document.querySelector('input[name=mode]:checked').value !== "delivery";
});

function makeOrderId(loc){
  const d = new Date(), pad = n => String(n).padStart(2,"0");
  return `L${CONFIG.locations.indexOf(loc)+1}-${pad(d.getHours())}${pad(d.getMinutes())}-${pad(Math.floor(Math.random()*100))}`;
}

function buildOrder(){
  const mode = document.querySelector('input[name=mode]:checked').value;
  const name = $("#cname").value.trim(), phone = $("#cphone").value.trim();
  const addr = $("#caddr").value.trim(), notes = $("#cnotes").value.trim();
  const loc = LOC(locId);
  if (!loc) return { error: t("errLoc") };
  if (!name) return { error: t("errName") };
  if (!phone) return { error: t("errPhone") };
  if (mode === "delivery" && !addr) return { error: t("errAddr") };
  if (!orderId) orderId = makeOrderId(loc);
  const ol = T[CONFIG.orderLanguage] ? CONFIG.orderLanguage : "ro", L = T[ol];
  const items = Object.entries(cart).map(([id,q]) => ({ id, name: ITEMS[id][ol][0], qty: q, unit_price: ITEMS[id].price, line_total: ITEMS[id].price*q }));
  const total = items.reduce((s,i) => s + i.line_total, 0);
  const itemsText = items.map(i => `${i.qty} x ${i.name} - ${money(i.line_total)}`).join("\n");
  let m = `#${orderId}\n`;
  m += mode === "delivery"
    ? `>> ${L.msgPickFrom}: ${loc.name.toUpperCase()} <<\n${loc.address[ol]}\n\n>> ${L.msgDeliverTo}:\n${addr}\n`
    : `>> ${L.msgPickupAt}: ${loc.name.toUpperCase()} <<\n`;
  m += `${L.msgName}: ${name}\n${L.msgPhone}: ${phone}\n`;
  if (notes) m += `${L.msgNotes}: ${notes}\n`;
  m += `\n${itemsText}\n${L.total}: ${money(total)}`;
  return { data: {
    order_id: orderId, created_at: new Date().toISOString(),
    location_id: loc.id, location_name: loc.name, location_address: loc.address[ol], location_phone: loc.phone,
    mode, needs_courier: mode === "delivery" ? "yes" : "no",
    courier_phone: mode === "delivery" ? CONFIG.courierPhone : "",
    customer_name: name, customer_phone: phone,
    delivery_address: mode === "delivery" ? addr : "",
    notes, items_text: itemsText, items_json: JSON.stringify(items),
    total, currency: CONFIG.currency, customer_language: lang, message: m
  }};
}

$("#sendOrder").onclick = async () => {
  const r = buildOrder();
  $("#err").textContent = r.error || "";
  if (r.error) return;
  const b = $("#sendOrder");
  b.disabled = true; b.textContent = t("sending");
  try {
    if (!CONFIG.webhookUrl) throw new Error("no webhook");
    // form-encoded + no-cors: the browser sends the order without needing
    // Make.com to allow cross-site replies. It only fails on a real network error.
    await fetch(CONFIG.webhookUrl, { method:"POST", mode:"no-cors", body: new URLSearchParams(r.data) });
    showDone();
  } catch (e) {
    $("#err").textContent = t("errSend");
  } finally {
    b.disabled = false; b.textContent = t("send");
  }
};

function showDone(){
  $("#doneId").textContent = `${t("doneId")} #${orderId}`;
  $("#orderForm").hidden = true; $("#done").hidden = false;
  $("#sheetTitle").textContent = t("doneTitle");
  cart = {}; store("cart", "{}");
  renderCart();
}
$("#newOrder").onclick = () => {
  orderId = ""; $("#cnotes").value = "";
  $("#orderForm").hidden = false; $("#done").hidden = true;
  $("#sheetTitle").textContent = t("yourOrder");
  closeSheet();
};

$("#yr").textContent = new Date().getFullYear();
applyLang();
</script>
</body>
